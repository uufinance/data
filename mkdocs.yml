site_name: U.S.E. Finance Data Hub
site_url: https://usefinance.github.io/data/

theme:
  name: material
  logo: assets/images/Finance.png
  favicon: assets/images/favicon.png
  font:
    text: Open Sans
    code: Roboto Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - assets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

